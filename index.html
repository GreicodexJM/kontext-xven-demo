<div class="grid">${EQ.map(e=>`<div class="card"><span class="tag">FICTICIO</span><h2 style="margin-top:8px">${e.modelo}</h2><div class="muted">${e.cliente}<br>${e.id}</div><div class="qr">${e.qr}</div>
<button class="btn pri" onclick="go('#/equipo/${e.id}')">📷 Simular escaneo</button></div>`).join("")}</div>`}
function pasaporte(e){const t=Object.entries(e.toner);const low=t.some(([k,v])=>v<20);
app.innerHTML=`<a class="back" onclick="go('#/')">← Equipos</a><div class="card" style="margin-top:10px"><span class="tag">PASAPORTE DEL EQUIPO · DATOS FICTICIOS</span>
<h1>${e.modelo}</h1><div class="muted">${e.tipo}</div><dl>
<dt>ID QRi</dt><dd>${e.id}</dd><dt>Serial</dt><dd>${e.serial}</dd><dt>Cliente</dt><dd>${e.cliente}</dd><dt>Sede</dt><dd>${e.sede}</dd>
<dt>Contrato SGD</dt><dd>${e.contrato}</dd><dt>SLA</dt><dd>${e.sla}</dd><dt>Último servicio</dt><dd>${e.ultimo}</dd><dt>Contador</dt><dd>${e.contador} págs.</dd></dl>
<b style="font-size:14px">Nivel de tóner</b>${t.map(([k,v])=>`<div class="ton"><b>${k}</b><div class="bar"><i style="width:${v}%;background:${col[k]}"></i></div><span>${v}%</span></div>`).join("")}
${low?`<p style="color:#b3261e;font-size:13px">⚠️ Tóner bajo detectado: se recomienda pedir insumos.</p>`:""}
<button class="btn odoo" onclick="go('#/soporte/${e.id}')">🛠️ Pedir soporte</button>
<button class="btn sec" onclick="go('#/insumos/${e.id}')">🧴 Pedir insumos</button></div>`}
function ro(l,v){return `<label>${l}</label><input readonly value="${v}">`}
function soporte(e){app.innerHTML=`<a class="back" onclick="go('#/equipo/${e.id}')">← Pasaporte</a><div style="margin-top:10px"><div class="odoobar"><span>Odoo · Helpdesk</span><span class="tag">SIMULADO</span></div><div class="odoobox">
<h2>Nuevo ticket de soporte</h2><p class="muted">Datos del equipo prellenados desde el QR. Solo describa el problema.</p>
${ro("Cliente",e.cliente)}${ro("Equipo",e.modelo+" · "+e.serial)}${ro("Sede",e.sede)}${ro("Contrato / SLA",e.contrato+" · "+e.sla)}${ro("Contador",e.contador)}
<label>Tipo</label><select id="tipo"><option>Falla / atasco</option><option>Calidad de impresión</option><option>Error en pantalla</option><option>Red / escaneo</option></select>
<label>Urgencia</label><select id="urg"><option>Normal</option><option>Alta</option><option>Crítica (equipo detenido)</option></select>
<label>Describa el problema *</label><textarea id="desc" placeholder="Ej.: atasco de papel en la bandeja 2…"></textarea>
<label>Nombre de contacto</label><input id="cnom" placeholder="Quién reporta">
<label>Teléfono de contacto</label><input id="ctel" type="tel" placeholder="Ej.: 0412-0000000"></div></div>
<div class="sticky"><button class="btn call" onclick="llamar()">📞 Llamar a soporte</button><button class="btn odoo" onclick="enviarTicket('${e.id}')">Crear ticket</button></div>`;app.classList.add("padb")}
function enviarTicket(id){const e=find(id),d=$("#desc").value.trim();if(!d){$("#desc").focus();$("#desc").style.borderColor="#b3261e";return}
const n="HD-DEMO-"+Math.floor(10000+Math.random()*89999),h=parseInt(e.sla)||4;const eta=new Date(Date.now()+h*3600e3);
app.innerHTML=`<div class="card"><div class="okbig">✅</div><h1 style="text-align:center">Ticket ${n} creado</h1><dl>
<dt>Equipo</dt><dd>${e.modelo} · ${e.serial}</dd><dt>Tipo</dt><dd>${$("#tipo")?.value||""}</dd><dt>Urgencia</dt><dd>${$("#urg")?.value||""}</dd><dt>Contacto</dt><dd>${(($("#cnom")?.value||"")+" "+($("#ctel")?.value||"")).replace(/</g,"&lt;")}</dd><dt>Problema</dt><dd>${d.replace(/</g,"&lt;")}</dd>
<dt>Equipo asignado</dt><dd>Soporte SLA ${e.sla.split("(")[1]?.replace(")","")||""} – Región ${e.sede.split(/[–(]/).pop().replace(")","").trim()}</dd>
<dt>Técnico</dt><dd>Técnico Demo #07</dd><dt>ETA</dt><dd>${eta.toLocaleString("es-VE",{weekday:"short",hour:"2-digit",minute:"2-digit"})} (SLA ${e.sla})</dd></dl>
<p class="muted">Notificación enviada al cliente y al equipo (simulado). En producción: ticket real en Odoo Helpdesk vía conector Kontext.</p>
<button class="btn pri" onclick="go('#/equipo/${e.id}')">Volver al pasaporte</button></div>`}
function insumos(e){cart={};const low=Object.entries(e.toner).filter(([k,v])=>v<25).map(([k])=>k);
CONS[e.modelo].forEach(([s,n],i)=>{const m={negro:"K",cian:"C",magenta:"M",amarillo:"Y"};const k=Object.keys(m).find(x=>n.includes(x));cart[s]=k&&low.includes(m[k])?1:0});
app.innerHTML=`<a class="back" onclick="go('#/equipo/${e.id}')">← Pasaporte</a><div class="card" style="margin-top:10px"><span class="tag">PORTAL DE COMPRAS · SIMULADO</span>
<h2 style="margin-top:8px">Insumos compatibles – ${e.modelo}</h2><p class="muted">${e.cliente} · ${e.sede} · ${e.contrato}. Sugerencias según nivel de tóner. Códigos y precios ficticios (USD).</p>
<div id="items"></div><h2 id="tot" style="text-align:right"></h2><label>Observaciones</label><input id="obs" placeholder="Opcional">
</div><div class="sticky"><button class="btn ok" onclick="enviarPedido('${e.id}')">Enviar pedido</button></div>`;app.classList.add("padb");pintar(e)}
function pintar(e){$("#items").innerHTML=CONS[e.modelo].map(([s,n,p])=>`<div class="item"><div><b>${n}</b><div class="muted">${s} · $${p}</div></div><div class="qty"><button onclick="q('${e.id}','${s}',-1)">−</button><b>${cart[s]}</b><button onclick="q('${e.id}','${s}',1)">+</button></div></div>`).join("");
$("#tot").textContent="Total: $"+CONS[e.modelo].reduce((a,[s,,p])=>a+p*cart[s],0)}
function q(id,s,d){cart[s]=Math.max(0,cart[s]+d);pintar(find(id))}
function enviarPedido(id){const e=find(id),it=CONS[e.modelo].filter(([s])=>cart[s]);if(!it.length)return alert("Agregue al menos un insumo");
const t=it.reduce((a,[s,,p])=>a+p*cart[s],0),n="PO-DEMO-"+Math.floor(1000+Math.random()*8999);
app.innerHTML=`<div class="card"><div class="okbig">📦</div><h1 style="text-align:center">Pedido ${n} recibido</h1>${it.map(([s,nm,p])=>`<div class="item"><span>${cart[s]} × ${nm}</span><b>$${p*cart[s]}</b></div>`).join("")}
<h2 style="text-align:right">Total: $${t}</h2><p class="muted">Entrega estimada: 24–48 h en ${e.sede}. Asociado a ${e.contrato}. (Simulado)</p>
<button class="btn pri" onclick="go('#/equipo/${e.id}')">Volver al pasaporte</button></div>`}
// Llamada de voz (Web Speech API, sin servidor)
let callOn=false,curRec=null,typedRes=null;const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
function stopCall(){callOn=false;try{curRec&&curRec.abort()}catch(_){}try{speechSynthesis.cancel()}catch(_){}const c=document.getElementById("callscr");if(c)c.remove();if(typedRes){typedRes(null);typedRes=null}}
function st(t){const s=$("#callscr .st");if(s)s.textContent=t}
function addMsg(c,t){const ch=$("#callscr .chat");if(ch){const p=document.createElement("p");p.className=c;p.textContent=t;ch.appendChild(p);ch.scrollTop=ch.scrollHeight}}
let VOICES=[];function loadVoices(){try{VOICES=speechSynthesis.getVoices()||[]}catch(_){}}if("speechSynthesis"in window){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(_){speechSynthesis.onvoiceschanged=loadVoices}}
function pickVoice(){if(!VOICES.length)loadVoices();const vs=VOICES;return vs.find(v=>/es[-_]VE/i.test(v.lang))||vs.find(v=>/es[-_](ES|MX|US)/i.test(v.lang))||vs.find(v=>/es[-_](419|CO)/i.test(v.lang))||vs.find(v=>/^es/i.test(v.lang))}
window.__utts=[];function unlockTTS(){if(!("speechSynthesis"in window))return;try{speechSynthesis.cancel();speechSynthesis.resume();const u=new SpeechSynthesisUtterance("Llamando");u.lang="es-ES";u.volume=0.01;u.rate=1.25;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}window.__utts.push(u);speechSynthesis.speak(u)}catch(_){}}
let speakingNow=false;
function say(t){return new Promise(r=>{if(!callOn)return r();try{curRec&&curRec.abort()}catch(_){}curRec=null;addMsg("a","Soporte: "+t);st("Hablando…");if(!("speechSynthesis"in window))return setTimeout(r,900);
const u=new SpeechSynthesisUtterance(t);u.lang="es-ES";u.rate=1.25;u.volume=1;const v=pickVoice();if(v){u.voice=v;u.lang=v.lang}window.__utts.push(u);if(window.__utts.length>20)window.__utts.shift();speakingNow=true;let done=false,started=false,t0=Date.now();const est=1500+t.length*75;
const f=()=>{if(done)return;done=true;clearInterval(iv);setTimeout(()=>{speakingNow=false;r()},300)};u.onstart=()=>{started=true};u.onend=f;u.onerror=f;
const iv=setInterval(()=>{if(!callOn)return f();if(speechSynthesis.speaking||speechSynthesis.pending)started=true;else if(started&&Date.now()-t0>800)f();else if(!started&&Date.now()-t0>3000)f();if(Date.now()-t0>est+2500)f()},250);try{speechSynthesis.resume()}catch(_){}speechSynthesis.speak(u)})}
function waitSilence(){return new Promise(r=>{const c=()=>{if(!callOn||(!speakingNow&&!(window.speechSynthesis&&speechSynthesis.speaking)))setTimeout(r,300);else setTimeout(c,150)};c()})}
async function listenVoice(){await waitSilence();if(!callOn)return null;return new Promise(res=>{const r=new SR();curRec=r;r.lang="es-VE";r.interimResults=true;r.maxAlternatives=1;let fin="",got=false;
r.onresult=e=>{if(speakingNow||speechSynthesis.speaking)return;let s="";for(const x of e.results)s+=x[0].transcript;fin=s;st("Escuchando… "+s)};r.onerror=ev=>{if(ev.error==="language-not-supported"){r.lang="es-ES"}if(ev.error==="not-allowed"||ev.error==="service-not-allowed"){useTyped=true}};
r.onend=()=>{curRec=null;res(fin.trim()||null)};try{st("🎙️ Escuchando… hable ahora");r.start()}catch(_){res(null)}})}
let useTyped=!SR;
function listenTyped(){return new Promise(res=>{const b=$("#callscr .typ");b.style.display="flex";const i=b.querySelector("input");i.value="";i.focus();st("Escriba su respuesta");typedRes=v=>{b.style.display="none";res(v)}})}
async function ask(q,tries=2){for(let k=0;k<tries&&callOn;k++){await say(k?"Disculpe, no le escuché bien. "+q:q);if(!callOn)return null;let a=useTyped?await listenTyped():await listenVoice();if(!a&&!useTyped&&callOn&&k===tries-1){useTyped=true;await say("Puede escribir su respuesta.");a=await listenTyped()}if(a){addMsg("u","Usted: "+a);return a}}return null}
function urgOf(a){a=(a||"").toLowerCase();if(/cr[ií]tic|detenid|parad|no funciona|no enciende|urgent[ií]simo/.test(a))return 2;if(/alta|urgent|pronto|r[aá]pid|hoy/.test(a))return 1;return 0}
function tipoOf(a){a=a.toLowerCase();if(/atasc|atora|papel|bandeja|fusor/.test(a))return 0;if(/raya|mancha|calidad|claro|oscur|color|borros/.test(a))return 1;if(/pantalla|c[oó]digo|error|mensaje/.test(a))return 2;if(/red|escane|correo|wifi|ip/.test(a))return 3;return -1}
function fill(id,v){const el=$(id);if(el&&v!=null){el.value=v;el.style.borderColor="#0f9d58";el.style.background="#eefaf2"}}
async function llamar(){const e=find(location.hash.split("/")[2]);if(!e)return;stopCall();callOn=true;useTyped=!SR;
const d=document.createElement("div");d.id="callscr";d.innerHTML=`<div class="who"><div class="av ring">🎧</div><b>Soporte Kontext · ${e.modelo}</b><div class="st">Llamando…</div></div><div class="chat"></div>
<form class="typ" onsubmit="event.preventDefault();typedRes&&typedRes(this.querySelector('input').value.trim()||null)"><input placeholder="Escriba aquí…" enterkeyhint="send"><button class="btn pri">Enviar</button></form>
<button class="btn hang" onclick="stopCall()">📵 Colgar</button>`;document.body.appendChild(d);
unlockTTS();
await new Promise(r=>setTimeout(r,1300));if(!callOn)return;$("#callscr .av").classList.remove("ring");st("En llamada");
const p=await ask(`Hola, gracias por llamar a soporte. Veo su ${e.modelo}, serial ${e.serial}, en ${e.sede}. ¿Qué problema presenta el equipo?`);if(!callOn)return;
if(p){fill("#desc",p);const ti=tipoOf(p);if(ti>=0)$("#tipo").selectedIndex=ti}
const u=await ask("Entendido. ¿Qué tan urgente es? ¿Normal, alta, o crítica porque el equipo está detenido?");if(!callOn)return;const ui=urgOf(u);$("#urg").selectedIndex=ui;fill("#urg",null);$("#urg").style.borderColor="#0f9d58";
const n=await ask("¿A nombre de quién registro el reporte?");if(!callOn)return;if(n)fill("#cnom",n.replace(/^(me llamo|soy|mi nombre es|a nombre de)\s+/i,""));
const t=await ask("¿Y a qué número de teléfono le contactamos?");if(!callOn)return;if(t)fill("#ctel",t.replace(/[^\d+]/g,"").replace(/^(\d{4})(\d{7})$/,"$1-$2")||t);
await say(`Perfecto. Registré: ${p||"sin descripción"}. Urgencia ${["normal","alta","crítica"][ui]}. Contacto ${$("#cnom").value||"sin nombre"}. Ya completé el formulario; cuelgue y pulse Crear ticket para enviarlo. Hasta luego.`);
if(callOn){st("Llamada finalizada");setTimeout(stopCall,1200)}}
route();
</script></body></html>
